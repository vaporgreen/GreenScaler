name: Sync OptiScaler Wiki Profiles

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GreenScaler
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync OptiScaler Wiki & rebuild profiles.json
        run: |
          python3 scripts/sync_profiles.py
          python3 scripts/test_greenscaler.py

      - name: Commit updated profiles.json if changed
        run: |
          if git diff --quiet py_modules/greenscaler/data/profiles.json; then
            echo "profiles.json unchanged."
            exit 0
          fi
          git config user.name "vaporgreen"
          git config user.email "vapourgreensite@gmail.com"
          git add py_modules/greenscaler/data/profiles.json
          git commit -m "chore(profiles): sync OptiScaler Wiki compatibility database"
          git push
